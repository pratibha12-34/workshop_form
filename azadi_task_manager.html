<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=Rozha+One&display=swap" rel="stylesheet">
  
  <!-- Material Icons & FontAwesome -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --color-saffron: #FF9933;
      --color-saffron-glow: rgba(255, 153, 51, 0.35);
      --color-white: #FFFFFF;
      --color-green: #138808;
      --color-green-glow: rgba(19, 136, 8, 0.35);
      --color-navy: #000080;
      --color-gold: #FFD700;
      --color-gold-glow: rgba(255, 215, 0, 0.4);
      --bg-dark-main: #0B0F19;
      --bg-dark-sidebar: #111827;
      --bg-card-glass: rgba(30, 41, 59, 0.7);
      --bg-card-hover: rgba(51, 65, 85, 0.8);
      --border-glass: rgba(255, 255, 255, 0.08);
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      
      --font-main: 'Outfit', sans-serif;
      --font-hindi: 'Noto Sans Devanagari', sans-serif;
      --font-display: 'Rozha One', serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-main); }
    body {
      background-color: var(--bg-dark-main);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(255, 153, 51, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(19, 136, 8, 0.05) 0%, transparent 40%);
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark-sidebar); }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--color-saffron); }
    .app-layout-container { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
    /* Sidebar */
    .app-sidebar {
      width: 280px;
      background-color: var(--bg-dark-sidebar);
      border-right: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      flex-shrink: 0;
      z-index: 10;
    }
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-glass);
      margin-bottom: 20px;
    }
    .brand-logo-container {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--color-saffron), var(--color-green));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 20px;
      box-shadow: 0 4px 12px var(--color-saffron-glow);
    }
    .brand-title {
      font-size: 1.2rem;
      font-weight: 800;
      background: linear-gradient(to right, var(--color-saffron), #fff, var(--color-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-subtitle { font-size: 0.75rem; color: var(--text-secondary); }
    .sidebar-nav { display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
    .nav-link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-radius: 10px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }
    .nav-link-btn:hover { background-color: var(--bg-card-hover); color: #fff; transform: translateX(4px); }
    .nav-link-btn.active {
      background: linear-gradient(90deg, rgba(255, 153, 51, 0.15), rgba(19, 136, 8, 0.15));
      border-left: 4px solid var(--color-saffron);
      color: #fff;
      font-weight: 700;
    }
    .nav-counter-pill {
      background: var(--color-saffron);
      color: #000;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 12px;
      margin-left: auto;
    }
    .sidebar-streak-widget {
      background: linear-gradient(135deg, rgba(255, 153, 51, 0.1), rgba(255, 215, 0, 0.05));
      border: 1px solid rgba(255, 153, 51, 0.3);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .widget-header { display: flex; align-items: center; gap: 8px; color: var(--color-saffron); font-weight: 700; font-size: 0.85rem; }
    .widget-value { font-size: 1.3rem; font-weight: 800; color: var(--color-gold); margin: 4px 0; }
    .widget-subtitle { font-size: 0.75rem; color: var(--text-secondary); }
    .language-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px;
      border-radius: 8px;
      background-color: var(--bg-card-glass);
      border: 1px solid var(--border-glass);
      color: var(--text-primary);
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
    }
    .language-toggle-btn:hover { border-color: var(--color-saffron); background-color: var(--bg-card-hover); }
    /* Top Header */
    .app-main-viewport { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
    .top-header {
      height: 72px;
      background-color: var(--bg-dark-sidebar);
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      flex-shrink: 0;
    }
    .search-bar-container {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: var(--bg-dark-main);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      padding: 8px 16px;
      width: 400px;
    }
    .search-bar-container:focus-within { border-color: var(--color-saffron); }
    .search-input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.9rem;
      width: 100%;
    }
    .header-right-actions { display: flex; align-items: center; gap: 20px; }
    .header-date-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .btn-primary-tiranga {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--color-saffron), #e67e22);
      border: none;
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 14px var(--color-saffron-glow);
      transition: all 0.2s ease;
    }
    .btn-primary-tiranga:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--color-saffron-glow); }
    .btn-secondary-glass {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 10px;
      background: var(--bg-card-glass);
      border: 1px solid var(--border-glass);
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .user-profile-badge { display: flex; align-items: center; gap: 10px; }
    .avatar-circle {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, var(--color-saffron), var(--color-gold));
      color: #000; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 0.85rem;
    }
    .page-content-scrollable { flex-grow: 1; overflow-y: auto; padding: 32px; }
    /* Greeting Banner */
    .greeting-hero-banner {
      background: linear-gradient(135deg, rgba(255, 153, 51, 0.15), rgba(19, 136, 8, 0.15));
      border: 1px solid rgba(255, 153, 51, 0.3);
      border-radius: 20px;
      padding: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .banner-badge-pill {
      display: inline-block;
      background: rgba(255, 153, 51, 0.2);
      color: var(--color-saffron);
      font-weight: 800;
      font-size: 0.8rem;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    .greeting-heading { font-size: 1.8rem; font-weight: 800; margin-bottom: 6px; }
    .user-name-highlight { color: var(--color-gold); }
    .greeting-mission-text { color: var(--text-secondary); margin-bottom: 16px; }
    /* Stats Grid */
    .dashboard-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background-color: var(--bg-card-glass);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .stat-icon-wrapper {
      width: 48px; height: 48px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .stat-icon-wrapper.saffron { background: rgba(255, 153, 51, 0.15); color: var(--color-saffron); }
    .stat-icon-wrapper.green { background: rgba(19, 136, 8, 0.15); color: var(--color-green); }
    .stat-icon-wrapper.fire { background: rgba(255, 69, 0, 0.15); color: #ff4500; }
    .stat-icon-wrapper.gold { background: rgba(255, 215, 0, 0.15); color: var(--color-gold); }
    .stat-icon-wrapper.blue { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
    .stat-value { font-size: 1.5rem; font-weight: 800; display: block; }
    .stat-label { font-size: 0.8rem; color: var(--text-secondary); }
    /* Celebration Banner */
    .all-complete-banner {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(19, 136, 8, 0.2));
      border: 2px solid var(--color-gold);
      border-radius: 16px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
    }
    /* Dandi Progress Card */
    .dandi-progress-card {
      background-color: var(--bg-card-glass);
      border: 1px solid var(--border-glass);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 28px;
    }
    .dandi-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .dandi-title-group { display: flex; align-items: center; gap: 8px; color: var(--color-saffron); font-weight: 800; font-size: 1.2rem; }
    .dandi-percent-badge { background: var(--color-saffron); color: #000; font-weight: 800; padding: 4px 12px; border-radius: 20px; }
    .dandi-subtitle-text { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 24px; }
    .dandi-track-container { position: relative; padding: 16px 0; }
    .dandi-track-line-bg { height: 10px; background-color: rgba(255, 255, 255, 0.1); border-radius: 5px; position: relative; }
    .dandi-track-line-fill { height: 100%; background: linear-gradient(90deg, var(--color-saffron), #fff, var(--color-green)); border-radius: 5px; transition: width 0.5s ease; }
    
    .dandi-walker-figure { position: absolute; top: -6px; transition: left 0.5s ease; z-index: 5; }
    .walker-icon-wrapper {
      background: var(--color-gold); color: #000; width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 16px;
      box-shadow: 0 0 12px var(--color-gold-glow); animation: bounce 1s infinite alternate;
    }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-6px); } }
    .dandi-milestones-row { display: flex; justify-content: space-between; margin-top: 20px; }
    .milestone-node { display: flex; flex-direction: column; align-items: center; gap: 4px; opacity: 0.4; }
    .milestone-node.reached { opacity: 1; color: var(--color-gold); }
    .node-icon-circle {
      width: 32px; height: 32px; border-radius: 50%; background-color: var(--bg-dark-sidebar);
      border: 2px solid var(--text-muted); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700;
    }
    .milestone-node.reached .node-icon-circle { border-color: var(--color-gold); color: var(--color-gold); }
    /* Dashboard Tasks Section */
    .dashboard-section-card {
      background-color: var(--bg-card-glass);
      border: 1px solid var(--border-glass);
      border-radius: 18px;
      padding: 24px;
    }
    .section-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .section-title { font-size: 1.2rem; font-weight: 800; }
    .dashboard-tasks-list { display: flex; flex-direction: column; gap: 10px; }
    .task-row-card {
      display: flex; align-items: center; gap: 14px; background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-glass); border-radius: 12px; padding: 14px; cursor: pointer;
    }
    .task-row-card.completed { opacity: 0.6; text-decoration: line-through; }
    .task-content { flex-grow: 1; }
    .task-title-text { font-weight: 700; }
    .tag-category { padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; background: rgba(255, 255, 255, 0.08); }
    .tag-priority { padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; }
    .tag-priority.high { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    .tag-priority.medium { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
    .tag-priority.low { background: rgba(16, 185, 129, 0.2); color: #10b981; }
    /* Tasks Page & Filter */
    .tasks-page-container, .streaks-page-container, .badges-page-container, .certificate-page-container {
      display: flex; flex-direction: column; gap: 24px;
    }
    .page-header-banner { display: flex; justify-content: space-between; align-items: center; }
    .page-title { font-size: 1.8rem; font-weight: 800; }
    .page-subtitle { color: var(--text-secondary); font-size: 0.9rem; }
    .tasks-filter-bar, .badges-filter-bar {
      display: flex; justify-content: space-between; align-items: center;
      background-color: var(--bg-card-glass); border: 1px solid var(--border-glass); border-radius: 12px; padding: 12px 16px;
    }
    .filter-tab-btn {
      background: transparent; border: none; color: var(--text-secondary); font-weight: 600; padding: 6px 14px; border-radius: 8px; cursor: pointer;
    }
    .filter-tab-btn.active { background-color: var(--color-saffron); color: #000; font-weight: 800; }
    .task-cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .task-full-card {
      background-color: var(--bg-card-glass); border: 1px solid var(--border-glass); border-radius: 14px; padding: 18px;
      display: flex; flex-direction: column; gap: 10px;
    }
    /* Streaks Page */
    .streak-stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .streak-hero-card {
      background: linear-gradient(135deg, rgba(255, 69, 0, 0.15), rgba(255, 153, 51, 0.05));
      border: 1px solid rgba(255, 69, 0, 0.3); border-radius: 16px; padding: 24px; display: flex; align-items: center; gap: 16px;
    }
    .milestones-timeline-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin-top: 12px; }
    .milestone-card {
      background-color: var(--bg-card-glass); border: 1px solid var(--border-glass); border-radius: 16px; padding: 20px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .milestone-card.unlocked { border-color: var(--color-gold); }
    /* Badges Page */
    .badges-showcase-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .badge-card-item {
      background-color: var(--bg-card-glass); border: 1px solid var(--border-glass); border-radius: 16px; padding: 20px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .badge-card-item.unlocked { border-color: var(--color-gold); }
    .badge-quote-box { background: rgba(0, 0, 0, 0.25); border-left: 3px solid var(--color-gold); padding: 10px; font-style: italic; border-radius: 6px; }
    /* Certificate Viewport */
    .cert-controls-card { background-color: var(--bg-card-glass); border: 1px solid var(--border-glass); border-radius: 16px; padding: 20px; }
    .cert-form-row { display: flex; gap: 16px; align-items: flex-end; }
    .certificate-preview-viewport { display: flex; justify-content: center; padding: 20px 0; }
    .certificate-card-frame {
      width: 780px; min-height: 520px; background-color: #0F172A; border-radius: 16px; position: relative; padding: 28px; color: #fff;
    }
    .cert-border-gold-inner {
      border: 2px solid var(--color-gold); height: 100%; border-radius: 10px; padding: 28px;
      display: flex; flex-direction: column; align-items: center; text-align: center; justify-content: space-between;
    }
    .cert-recipient-name { font-size: 2rem; font-weight: 800; color: var(--color-gold); margin: 10px 0; letter-spacing: 2px; }
    /* Modal Overlay */
    .modal-overlay-backdrop {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px);
      z-index: 100; display: flex; align-items: center; justify-content: center;
    }
    .modal-dialog-card {
      background-color: var(--bg-dark-sidebar); border: 1px solid var(--border-glass); border-radius: 18px; width: 480px; padding: 24px;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .form-label { font-size: 0.85rem; color: var(--text-secondary); font-weight: 600; }
    .btn-voice-header {
      display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 10px;
      background: rgba(255, 153, 51, 0.15); border: 1px solid rgba(255, 153, 51, 0.4); color: var(--color-saffron);
      font-weight: 700; font-size: 0.88rem; cursor: pointer; transition: all 0.2s ease;
    }
    .btn-voice-header:hover { background: rgba(255, 153, 51, 0.28); transform: translateY(-2px); }
    .btn-voice-header.listening { background: #ef4444; color: #fff; animation: pulse 1s infinite alternate; }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }
  </style>
</head>

        allDailyCompleteSubtitle: "आपने आज के सभी कार्य पूरे कर लिए हैं। प्रमाणपत्र डाउनलोड करें!",
        viewCertificate: "प्रमाणपत्र देखें",
        downloadPDF: "PDF प्रमाणपत्र डाउनलोड करें"
      }
    };
    // Badges Config
    const freedomBadges = [
      { id: "gandhi_first_step", nameEn: "Mahatma Gandhi – First Step", nameHi: "महात्मा गांधी – पहला कदम", icon: "🌟", freedomFighter: "Mahatma Gandhi", quote: "Be the change that you wish to see in the world.", req: "Complete 1st task" },
      { id: "bhagat_singh_courage", nameEn: "Bhagat Singh – Courage Badge", nameHi: "भगत सिंह – साहस बैज", icon: "🔥", freedomFighter: "Bhagat Singh", quote: "They may kill me, but they cannot kill my ideas.", req: "Complete 5 tasks" },
      { id: "sardar_patel_discipline", nameEn: "Sardar Patel – Discipline Badge", nameHi: "सरदार पटेल – अनुशासन बैज", icon: "🦚", freedomFighter: "Sardar Vallabhbhai Patel", quote: "Manpower without unity is not a strength.", req: "Complete all daily tasks" },
      { id: "laksmi_determination", nameEn: "Rani Lakshmibai – Determination", nameHi: "रानी लक्ष्मीबाई – संकल्प", icon: "✨", freedomFighter: "Rani Lakshmibai", quote: "We will fight for freedom until our last breath.", req: "3-day streak" },
      { id: "subhas_leadership", nameEn: "Subhas Chandra Bose – Leadership", nameHi: "सुभाष चंद्र बोस – नेतृत्व", icon: "🛡️", freedomFighter: "Netaji Subhas Chandra Bose", quote: "Give me blood and I will give you freedom!", req: "7-day streak" }
    ];
    // Initial State
    const defaultTasks = [
      { id: '1', title: 'Morning Yoga & Meditation', titleHi: 'सुबह का योग और ध्यान', category: 'Health', priority: 'High', completed: true },
      { id: '2', title: 'Study Freedom Fighter Biographies', titleHi: 'स्वतंत्रता सेनानियों की जीवनी पढ़ें', category: 'Mission', priority: 'High', completed: true },
      { id: '3', title: 'Complete Project Presentation', titleHi: 'प्रोजेक्ट प्रस्तुति पूरी करें', category: 'Work', priority: 'Medium', completed: false }
    ];
    function App() {
      const [lang, setLang] = useState('en');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem('azadi_html_tasks');
        return saved ? JSON.parse(saved) : defaultTasks;
      });
      const [searchQuery, setSearchQuery] = useState('');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [taskToEdit, setTaskToEdit] = useState(null);
      const [userName, setUserName] = useState('Aarav Sharma');
      const [isListening, setIsListening] = useState(false);
      const [voiceToast, setVoiceToast] = useState('');
      const recognitionRef = useRef(null);

      const handleVoiceClick = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert('Speech Recognition is not supported in this browser.');
          return;
        }

        if (isListening && recognitionRef.current) {
          recognitionRef.current.stop();
          setIsListening(false);
          return;
        }

        const recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = lang === 'hi' ? 'hi-IN' : 'en-US';

        recognition.onstart = () => {
          setIsListening(true);
          setVoiceToast('Listening for task title...');
        };

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript.trim();
          if (transcript) {
            let priority = 'Medium';
            if (/high|urgent|important|उच्च|जरूरी/i.test(transcript)) priority = 'High';
            else if (/low|minor|कम|आसान/i.test(transcript)) priority = 'Low';

            let category = 'Work';
            if (/health|yoga|exercise|gym|स्वास्थ्य|योग/i.test(transcript)) category = 'Health';
            else if (/mission|freedom|देश|राष्ट्र|मिशन/i.test(transcript)) category = 'Mission';
            else if (/personal|home|family|व्यक्तिगत|घर/i.test(transcript)) category = 'Personal';

            let title = transcript
              .replace(/^(add|create|new)\s+(task|todo|goal)?\s*/i, '')
              .replace(/^(नया|टास्क|काम)\s+(जोड़ें|बनाएं)?\s*/i, '')
              .trim() || transcript;

            const newTask = {
              id: Date.now().toString(),
              title,
              titleHi: title,
              category,
              priority,
              completed: false
            };
            setTasks(prev => [newTask, ...prev]);
            setVoiceToast(`Voice Task Added: "${title}" 🎙️`);
            setTimeout(() => setVoiceToast(''), 4000);
          }
        };

        recognition.onerror = () => {
          setIsListening(false);
          setVoiceToast('Voice recognition error.');
          setTimeout(() => setVoiceToast(''), 3000);
        };

        recognition.onend = () => {
          setIsListening(false);
        };

        recognitionRef.current = recognition;
        recognition.start();
      };
      useEffect(() => {
        localStorage.setItem('azadi_html_tasks', JSON.stringify(tasks));
      }, [tasks]);
      const t = (key) => translations[lang]?.[key] || translations['en']?.[key] || key;
      const totalTasks = tasks.length;
      const completedTasks = tasks.filter(t => t.completed).length;
      const progressPercent = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);
      const handleToggleTask = (id) => {
        setTasks(tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
      };
      const handleSaveTask = (taskData) => {
        if (taskToEdit) {
          setTasks(tasks.map(t => t.id === taskToEdit.id ? { ...t, ...taskData } : t));
        } else {
          const newTask = { id: Date.now().toString(), ...taskData, completed: false };
          setTasks([newTask, ...tasks]);
        }
        setIsModalOpen(false);
        setTaskToEdit(null);
      };
      const handleDeleteTask = (id) => {
        if (confirm('Delete task?')) {
          setTasks(tasks.filter(t => t.id !== id));
        }
      };
      const handleDownloadPDF = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('landscape', 'mm', 'a4');
        doc.setFillColor(15, 23, 42);
        doc.rect(0, 0, 297, 210, 'F');
        doc.setLineWidth(2);
        doc.setDrawColor(255, 153, 51);
        doc.line(10, 10, 287, 10);
        doc.setDrawColor(19, 136, 8);
        doc.line(10, 200, 287, 200);
        doc.setTextColor(255, 153, 51);
        doc.setFontSize(26);
        doc.text('CERTIFICATE OF ACCOMPLISHMENT', 148, 40, { align: 'center' });
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(16);
        doc.text('DAILY MISSION COMPLETE 🇮🇳', 148, 55, { align: 'center' });
        doc.setTextColor(255, 215, 0);
        doc.setFontSize(28);
        doc.text(userName.toUpperCase(), 148, 95, { align: 'center' });
        doc.setTextColor(203, 213, 225);
        doc.setFontSize(13);
        doc.text('For completing 100% of daily mission goals with courage and discipline.', 148, 115, { align: 'center' });
        doc.setTextColor(19, 136, 8);
        doc.setFontSize(16);
        doc.text('Jai Hind! Make India Proud Every Day.', 148, 135, { align: 'center' });
        doc.save(`Daily_Certificate_${new Date().toISOString().split('T')[0]}.pdf`);
      };
      return (

          {/* Sidebar */}
          <aside className="app-sidebar">
            <div className="sidebar-brand">
              <div className="brand-logo-container">🇮🇳</div>
              <div>
                <h1 className="brand-title">{t('appName')}</h1>
                <p className="brand-subtitle">{t('appSubTitle')}</p>
              </div>
            </div>
            <nav className="sidebar-nav">
              <button className={`nav-link-btn ${activeTab === 'dashboard' ? 'active' : ''}`} onClick={() => setActiveTab('dashboard')}>
                <i className="fa-solid fa-chart-pie"></i> {t('dashboard')}
              </button>
              <button className={`nav-link-btn ${activeTab === 'tasks' ? 'active' : ''}`} onClick={() => setActiveTab('tasks')}>
                <i className="fa-solid fa-list-check"></i> {t('tasksList')}
              </button>
              <button className={`nav-link-btn ${activeTab === 'streaks' ? 'active' : ''}`} onClick={() => setActiveTab('streaks')}>
                <i className="fa-solid fa-fire" style={{color: '#ff4500'}}></i> {t('streaks')}
              </button>
              <button className={`nav-link-btn ${activeTab === 'badges' ? 'active' : ''}`} onClick={() => setActiveTab('badges')}>
                <i className="fa-solid fa-award"></i> {t('badges')}
                <span className="nav-counter-pill">5</span>
              </button>
              <button className={`nav-link-btn ${activeTab === 'certificate' ? 'active' : ''}`} onClick={() => setActiveTab('certificate')}>
                <i className="fa-solid fa-certificate"></i> {t('certificateGen')}
              </button>
            </nav>
            <div className="sidebar-streak-widget">
              <div className="widget-header"><i className="fa-solid fa-fire"></i> {t('currentStreak')}</div>
              <div className="widget-value">5 Days Streak</div>
              <div className="widget-subtitle">Keep the freedom flame burning!</div>
            </div>
            <button className="language-toggle-btn" onClick={() => setLang(lang === 'en' ? 'hi' : 'en')}>
              <i className="fa-solid fa-language"></i> {lang === 'en' ? 'हिन्दी (Hindi)' : 'English (ENG)'}
            </button>
          </aside>
          {/* Viewport */}
          <div className="app-main-viewport">
            <header className="top-header">
              <div className="search-bar-container">
                <i className="fa-solid fa-magnifying-glass" style={{color: '#64748B'}}></i>
                <input
                  type="text"
                  className="search-input"
                  placeholder={t('searchPlaceholder')}
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                />
              </div>
              <div className="header-right-actions">
                {voiceToast && <span style={{background: 'rgba(255,153,51,0.2)', border: '1px solid #FF9933', padding: '6px 12px', borderRadius: '12px', fontSize: '0.85rem', color: '#FFD700'}}>{voiceToast}</span>}
                <button className={`btn-voice-header ${isListening ? 'listening' : ''}`} onClick={handleVoiceClick} title="Add Task by Voice">
                  <i className={isListening ? "fa-solid fa-microphone-slash" : "fa-solid fa-microphone"}></i>
                  <span>{isListening ? (lang === 'hi' ? 'सुन रहा है...' : 'Listening...') : (lang === 'hi' ? 'वॉइस कार्य' : 'Voice Task')}</span>
                </button>
                <button className="btn-primary-tiranga" onClick={() => { setTaskToEdit(null); setIsModalOpen(true); }}>
                  <i className="fa-solid fa-plus"></i> {t('addTask')}
                </button>
                <div className="user-profile-badge">
                  <div className="avatar-circle">aarav</div>
                  <div>
                    <div style={{fontWeight: 700, fontSize: '0.9rem'}}>Aarav Sharma</div>
                    <div style={{fontSize: '0.75rem', color: '#FF9933'}}>Patriot Leader 🇮🇳</div>
                  </div>
                </div>
              </div>
            </header>
            <main className="page-content-scrollable">
              {/* Dashboard */}
              {activeTab === 'dashboard' && (
                <div className="dashboard-page">
                  <div className="greeting-hero-banner">
                    <div>
                      <span className="banner-badge-pill">🇮🇳 Jai Hind! • जय हिन्द!</span>
                      <h2 className="greeting-heading">{t('welcomeUser')}, <span className="user-name-highlight">{userName}</span>!</h2>
                      <p className="greeting-mission-text">{t('greetingMission')}</p>
                    </div>
                    <div style={{fontSize: '3.5rem'}}>🇮🇳</div>
                  </div>
                  <div className="dashboard-stats-grid">
                    <div className="stat-card"><div className="stat-icon-wrapper saffron"><i className="fa-solid fa-list"></i></div><div><span className="stat-value">{totalTasks}</span><span className="stat-label">{t('totalTasks')}</span></div></div>
                    <div className="stat-card"><div className="stat-icon-wrapper green"><i className="fa-solid fa-check-double"></i></div><div><span className="stat-value">{completedTasks}</span><span className="stat-label">{t('completedTasks')}</span></div></div>
                    <div className="stat-card"><div className="stat-icon-wrapper fire"><i className="fa-solid fa-fire"></i></div><div><span className="stat-value">5 Days</span><span className="stat-label">{t('currentStreak')}</span></div></div>
                    <div className="stat-card"><div className="stat-icon-wrapper gold"><i className="fa-solid fa-award"></i></div><div><span className="stat-value">5</span><span className="stat-label">{t('badgesEarned')}</span></div></div>
                  </div>
                  {/* Dandi March Progress Bar */}
                  <div className="dandi-progress-card">
                    <div className="dandi-card-header">
                      <div className="dandi-title-group"><i className="fa-solid fa-person-walking"></i> {t('dandiProgressTitle')} 🇮🇳</div>
                      <span className="dandi-percent-badge">{progressPercent}%</span>
                    </div>
                    <p className="dandi-subtitle-text">As tasks are completed, your walking figure moves towards the Dandi sea!</p>
                    <div className="dandi-track-container">
                      <div className="dandi-track-line-bg">
                        <div className="dandi-track-line-fill" style={{width: `${progressPercent}%`}}></div>
                      </div>
                      <div className="dandi-walker-figure" style={{left: `calc(${progressPercent}% - 16px)`}}>
                        <div className="walker-icon-wrapper">👣</div>
                      </div>
                      <div className="dandi-milestones-row">
                        <div className={`milestone-node ${progressPercent >= 0 ? 'reached' : ''}`}><div className="node-icon-circle"><i className="fa-solid fa-house"></i></div><span>Start</span></div>
                        <div className={`milestone-node ${progressPercent >= 25 ? 'reached' : ''}`}><div className="node-icon-circle">25%</div><span>25%</span></div>
                        <div className={`milestone-node ${progressPercent >= 50 ? 'reached' : ''}`}><div className="node-icon-circle">50%</div><span>50%</span></div>
                        <div className={`milestone-node ${progressPercent >= 75 ? 'reached' : ''}`}><div className="node-icon-circle">75%</div><span>75%</span></div>
                        <div className={`milestone-node ${progressPercent >= 100 ? 'reached' : ''}`}><div className="node-icon-circle"><i className="fa-solid fa-water"></i></div><span>Dandi</span></div>
                      </div>
                    </div>
                  </div>
                  <div className="dashboard-section-card">
                    <h3 className="section-title">Today's Goals</h3>
                    <div className="dashboard-tasks-list" style={{marginTop: '16px'}}>
                      {tasks.map(task => (
                        <div key={task.id} className={`task-row-card ${task.completed ? 'completed' : ''}`}>
                          <i className={task.completed ? "fa-solid fa-circle-check" : "fa-regular fa-circle"} style={{fontSize: '22px', color: task.completed ? '#138808' : '#64748B', cursor: task.completed ? 'default' : 'not-allowed'}} onClick={() => { if(!task.completed) alert('⚠️ Cannot check manually! Click the Complete Task button at the bottom of the task to complete it.'); }}></i>
                          <div className="task-content">
                            <span className="task-title-text">{lang === 'hi' && task.titleHi ? task.titleHi : task.title}</span>
                          </div>
                          <span className={`tag-priority ${task.priority.toLowerCase()}`}>{task.priority}</span>
                          <button
                            type="button"
                            className="btn-primary-tiranga"
                            disabled={task.completed}
                            onClick={() => handleToggleTask(task.id)}
                            style={{padding: '6px 12px', fontSize: '0.8rem', background: task.completed ? 'rgba(19, 136, 8, 0.3)' : 'linear-gradient(135deg, #138808, #16a34a)', border: 'none', borderRadius: '8px', cursor: task.completed ? 'default' : 'pointer'}}
                          >
                            {task.completed ? '✓ Completed' : 'Complete Task'}
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}
              {/* Tasks List */}
              {activeTab === 'tasks' && (
                <div className="tasks-page-container">
                  <div className="page-header-banner">
                    <div>
                      <h2 className="page-title">{t('tasksList')} 🇮🇳</h2>
                      <p className="page-subtitle">Organize and complete your daily goals.</p>
                    </div>
                  </div>
                  <div className="task-cards-grid">
                    {tasks.filter(t => !searchQuery || t.title.toLowerCase().includes(searchQuery.toLowerCase())).map(task => (
                      <div key={task.id} className={`task-full-card ${task.completed ? 'completed' : ''}`}>
                        <div style={{display: 'flex', gap: '10px', alignItems: 'center'}}>
                          <i className={task.completed ? "fa-solid fa-circle-check" : "fa-regular fa-circle"} style={{fontSize: '22px', cursor: task.completed ? 'default' : 'not-allowed', color: task.completed ? '#138808' : '#64748B'}} onClick={() => { if(!task.completed) alert('⚠️ Cannot check manually! Click the Complete Task button at the bottom of the task card to complete it.'); }}></i>
                          <span style={{fontWeight: 700, flexGrow: 1}}>{task.title}</span>
                          <button style={{background: 'none', border: 'none', color: '#ef4444', cursor: 'pointer'}} onClick={() => handleDeleteTask(task.id)}><i className="fa-solid fa-trash"></i></button>
                        </div>
                        <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '14px', paddingTop: '10px', borderTop: '1px solid rgba(255,255,255,0.08)'}}>
                          <div style={{display: 'flex', gap: '8px'}}>
                            <span className="tag-category">{task.category}</span>
                            <span className={`tag-priority ${task.priority.toLowerCase()}`}>{task.priority}</span>
                          </div>
                          <button
                            type="button"
                            className="btn-primary-tiranga"
                            disabled={task.completed}
                            onClick={() => handleToggleTask(task.id)}
                            style={{padding: '6px 14px', fontSize: '0.82rem', background: task.completed ? 'rgba(19, 136, 8, 0.3)' : 'linear-gradient(135deg, #138808, #16a34a)', border: 'none', borderRadius: '8px', cursor: task.completed ? 'default' : 'pointer'}}
                          >
                            {task.completed ? '✓ Completed' : 'Complete Task'}
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {/* Streaks */}
              {activeTab === 'streaks' && (
                <div className="streaks-page-container">
                  <div className="page-header-banner">
                    <h2 className="page-title">{t('streaks')} 🔥</h2>
                  </div>
                  <div className="streak-stats-row">
                    <div className="streak-hero-card">
                      <i className="fa-solid fa-fire" style={{fontSize: '36px', color: '#ff4500'}}></i>
                      <div><span style={{fontSize: '1.6rem', fontWeight: 800}}>5 Days</span><div>Current Active Streak</div></div>
                    </div>
                    <div className="streak-hero-card">
                      <i className="fa-solid fa-trophy" style={{fontSize: '36px', color: '#FFD700'}}></i>
                      <div><span style={{fontSize: '1.6rem', fontWeight: 800}}>12 Days</span><div>Longest Streak Record</div></div>
                    </div>
                  </div>
                  <div className="milestones-timeline-grid">
                    <div className="milestone-card unlocked"><span style={{fontSize: '2rem'}}>✨</span><h4>Rani Lakshmibai Badge</h4><p>3 Days Streak - Determination</p></div>
                    <div className="milestone-card unlocked"><span style={{fontSize: '2rem'}}>⭐</span><h4>Subhas Chandra Bose Badge</h4><p>7 Days Streak - Leadership</p></div>
                    <div className="milestone-card"><span style={{fontSize: '2rem'}}>🏆</span><h4>Chandrashekhar Azad Badge</h4><p>15 Days Streak - Bravery</p></div>
                    <div className="milestone-card"><span style={{fontSize: '2rem'}}>👑</span><h4>Gandhi Ji Gold Badge</h4><p>30 Days Streak - Visionary</p></div>
                  </div>
                </div>
              )}
              {/* Badges */}
              {activeTab === 'badges' && (
                <div className="badges-page-container">
                  <div className="page-header-banner">
                    <h2 className="page-title">{t('badges')} 🏅</h2>
                  </div>
                  <div className="badges-showcase-grid">
                    {freedomBadges.map(b => (
                      <div key={b.id} className="badge-card-item unlocked">
                        <div style={{fontSize: '2.5rem'}}>{b.icon}</div>
                        <h4 style={{fontWeight: 800}}>{lang === 'hi' ? b.nameHi : b.nameEn}</h4>
                        <div className="badge-quote-box">"{b.quote}" <br/><b>— {b.freedomFighter}</b></div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {/* Certificate */}
              {activeTab === 'certificate' && (
                <div className="certificate-page-container">
                  <div className="page-header-banner">
                    <h2 className="page-title">{t('certificateGen')} 📜</h2>
                    <button className="btn-primary-tiranga" onClick={handleDownloadPDF}><i className="fa-solid fa-file-pdf"></i> {t('downloadPDF')}</button>
                  </div>
                  <div className="cert-controls-card">
                    <div className="form-group" style={{maxWidth: '300px'}}>
                      <label className="form-label">Recipient Name</label>
                      <input type="text" className="form-control-input" value={userName} onChange={(e) => setUserName(e.target.value)} />
                    </div>
                  </div>
                  <div className="certificate-preview-viewport">
                    <div className="certificate-card-frame">
                      <div className="cert-border-gold-inner">
                        <h1 style={{color: '#FF9933', fontSize: '1.8rem', fontWeight: 800}}>CERTIFICATE OF ACCOMPLISHMENT</h1>
                        <h3 style={{fontSize: '1.1rem'}}>DAILY MISSION COMPLETE 🇮🇳</h3>
                        <p style={{color: '#94A3B8', marginTop: '10px'}}>This certificate is proudly awarded to</p>

                        <p style={{maxWidth: '500px', fontSize: '0.95rem'}}>For completing 100% of today's daily tasks with courage, discipline, and dedication to personal excellence.</p>

                      </div>
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>
          {/* Modal */}
          {isModalOpen && (
            <div className="modal-overlay-backdrop" onClick={() => setIsModalOpen(false)}>

                  <div className="form-group">
                    <label className="form-label">Task Title</label>
                    <input name="title" type="text" className="form-control-input" defaultValue={taskToEdit?.title || ''} required />

                  <div className="form-group">
                    <label className="form-label">Category</label>
                    <select name="category" className="form-control-select" defaultValue={taskToEdit?.category || 'Work'}>
                      <option value="Work">Work</option>
                      <option value="Personal">Personal</option>
                      <option value="Health">Health</option>
                      <option value="Mission">Mission</option>
                    </select>
                  </div>
                  <div className="form-group">
                    <label className="form-label">Priority</label>
                    <select name="priority" className="form-control-select" defaultValue={taskToEdit?.priority || 'Medium'}>
                      <option value="High">High</option>
                      <option value="Medium">Medium</option>
                      <option value="Low">Low</option>
                    </select>
                  </div>
                  <div style={{display: 'flex', justifyContent: 'flex-end', gap: '10px', marginTop: '20px'}}>
                    <button type="button" className="btn-secondary-glass" onClick={() => setIsModalOpen(false)}>Cancel</button>
                    <button type="submit" className="btn-primary-tiranga">Save Goal</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
